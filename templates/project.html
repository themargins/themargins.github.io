<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ | The Margins</title>
$if(description)$
  <meta name="description" content="$description$">
$endif$
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a class="brand" href="/">The Margins</a>
      <div class="nav-links">
        <a href="/writing/">Writing</a>
        <a href="/projects/">Projects</a>
        <a href="/art/">Gallery</a>
      </div>
    </nav>

    <main>
      <article class="prose project">
        <header>
          <h1 class="post-title">$title$</h1>
$if(description)$
          <p class="post-dek">$description$</p>
$endif$
$if(byline)$
          <p class="post-meta">$byline$</p>
$endif$
        </header>

$body$
      </article>
      <p class="back"><a href="/projects/">All projects</a></p>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 The Margins · Write me <a href="mailto:hereinthemargins@gmail.com">hereinthemargins@gmail.com</a></p>
    </footer>
  </div>
</body>
</html>
